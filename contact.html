<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — JS Health Initiative East Africa</title>

<body><div id="nav"></div>
<main id="main"><section class="page-head"><div class="container"><h1>Contact</h1></div></section>
<section class="section"><div class="container contact-grid"><div><p class="section-lead">Reach us directly — we respond to every message.</p>
<ul class="contact-list"><li><strong>Email</strong><a href="mailto:jshealthinitiativeeastafrica@gmail.com">jshealthinitiativeeastafrica@gmail.com</a></li>
<li><strong>Phone</strong><a href="tel:+256779607233">+256 779 607 233</a></li><li><strong>Postal Address</strong>P.O. Box 424082</li><li><strong>Physical Address</strong>Mbarara, Uganda</li></ul></div>
<div class="contact-card"><h3>Send a message</h3><p class="muted">We usually reply within a day or two.</p>
<form class="stacked-form" data-type="contact" novalidate>
<label>Your name<input name="name" maxlength="100" autocomplete="name" required></label><label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
<label>Message<textarea name="message" rows="5" maxlength="3000" required></textarea></label>
<button class="btn btn-large">Send message</button><p class="form-status" role="status" aria-live="polite"></p></form></div></div></section>
</main><div id="foot"></div><script src="config.js"></script><script src="app.js"></script></body></html>
