<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer — JS Health Initiative East Africa</title>
<meta name="description" content="A Ugandan non-profit supporting communities through digital skilling, public health education, research and surgical care support.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27%23d31027%27/%3E%3C/svg%3E"><meta name="theme-color" content="#d31027"><link rel="stylesheet" href="style.css"></head>
<body><div id="nav"></div>
<main id="main"><section class="page-head"><div class="container"><h1>Volunteer with us</h1></div></section>
<section class="section"><div class="container">
<form class="stacked-form" data-type="volunteer" novalidate>
<label>Full name<input name="name" maxlength="100" autocomplete="name" required></label>
<label>Email<input name="email" type="email" maxlength="254" autocomplete="email" required></label>
<label>Phone (optional)<input name="phone" type="tel" maxlength="30"></label>
<label>Skills / how you'd like to help<textarea name="skills" rows="4" maxlength="3000" required></textarea></label>
<button class="btn btn-large">Submit application</button><p class="form-status" role="status" aria-live="polite"></p></form></div></section>
</main><div id="foot"></div><script src="config.js"></script><script src="app.js"></script></body></html>
